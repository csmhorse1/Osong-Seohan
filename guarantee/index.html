<style>
:root{
  --blue:#1E3A8A; --blue-d:#172554; --blue-dd:#0F172A;
  --blue-weak:#EFF6FF; --blue-line:#BFDBFE;
  --fg:#171719; --fg-2:#4E5968; --fg-3:#5B6472;
  --page:#EAEBEC; --card:#FFFFFF; --surface:#F7F7F8;
  --fill:rgba(112,115,124,.05); --line:rgba(112,115,124,.16); --line-2:rgba(112,115,124,.22);
  --green:#0F7B3E; --green-weak:#E7F6EC;
  --amber:#8A5A00; --amber-weak:#FFF4E0;
  --red:#D32B22; --red-weak:#FFF0EF;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:9999px;
  --font:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
h1,h2,h3{margin:0;line-height:1.35;font-weight:700;}
p{margin:0;}
button{font:inherit;color:inherit;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
a{color:var(--blue);}

.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--card);position:relative;display:flex;flex-direction:column;}
@media (min-width:481px){.app{box-shadow:0 0 0 1px var(--line);}}

.appbar{position:sticky;top:0;z-index:20;background:var(--card);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);}
.appbar-in{height:54px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;}
.appbar h1{font-size:16px;font-weight:600;text-align:center;}
.iconbtn{inline-size:44px;block-size:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--fg);border-radius:var(--r-pill);text-decoration:none;}
.iconbtn:hover{background:var(--fill);}

.wrap{padding:22px 20px calc(40px + env(safe-area-inset-bottom));}
.lead{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:6px 0 6px;line-height:1.35;}
.lead-sub{font-size:14px;color:var(--fg-3);margin-bottom:22px;line-height:1.6;}

.sect{font-size:13px;font-weight:600;color:var(--fg-3);margin:0 0 10px;}
p.sect{margin:26px 0 10px;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:13px;font-weight:600;color:var(--fg-2);}
.control-wrap{position:relative;display:flex;align-items:center;}
select,input[type=text]{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:15px;font-weight:600;color:var(--fg);font-family:inherit;transition:border-color .15s ease,box-shadow .15s ease;}
select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;}
select:disabled{background:var(--fill);color:var(--fg-3);cursor:not-allowed;opacity:.7;}
select:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak);}
.sel-arrow{position:absolute;right:13px;pointer-events:none;color:var(--fg-3);}
.suffix{position:absolute;right:14px;font-size:14px;font-weight:600;color:var(--fg-3);pointer-events:none;}
input[inputmode]{padding-right:44px;text-align:right;}
.help{font-size:12px;color:var(--fg-3);margin-top:2px;line-height:1.5;}

.pricebox{background:var(--blue-weak);border:1px solid var(--blue-line);border-radius:var(--r-lg);padding:16px;margin:6px 0 4px;display:none;}
.pricebox.on{display:block;}
.pricebox .k{font-size:12.5px;color:var(--fg-2);font-weight:600;}
.pricebox .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:2px;}
.pricebox .e{font-size:12px;color:var(--fg-3);margin-top:4px;}

.btn{inline-size:100%;min-block-size:54px;border:0;cursor:pointer;border-radius:var(--r);font-size:16px;font-weight:700;background:var(--blue);color:#fff;transition:background .15s ease;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;}
.btn:hover{background:var(--blue-d);}
.btn:disabled{background:var(--line-2);color:#fff;cursor:not-allowed;}

/* 결과 */
#result{display:none;margin-top:8px;}
#result.on{display:block;animation:fade .3s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}}

.summary{background:var(--fg);color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:14px;}
.summary .t{font-size:14px;font-weight:700;}
.summary .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:9px;color:rgba(255,255,255,.82);}
.summary .row b{color:#fff;font-weight:700;}
.summary .cap{margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16);}
.summary .cap .k{font-size:12px;color:rgba(255,255,255,.7);font-weight:600;}
.summary .cap .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;}

.gcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;}
.gcard+.gcard{margin-top:10px;}
.gcard .head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.gcard .nm{font-size:15px;font-weight:700;}
.gcard .nm small{display:block;font-size:11.5px;color:var(--fg-3);font-weight:600;margin-top:1px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-pill);font-size:13px;font-weight:800;white-space:nowrap;}
.pill.ok{background:var(--green-weak);color:var(--green);}
.pill.maybe{background:var(--amber-weak);color:var(--amber);}
.pill.no{background:var(--red-weak);color:var(--red);}
.gcard .line{font-size:13px;color:var(--fg-2);margin-top:11px;line-height:1.6;}
.gcard .line b{color:var(--fg);font-weight:700;}
.gcard .sub{font-size:12px;color:var(--fg-3);margin-top:7px;line-height:1.6;}

.checklist{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-top:14px;}
.checklist h3{font-size:13px;color:var(--fg-2);margin-bottom:10px;}
.checklist li{list-style:none;font-size:12.5px;color:var(--fg-2);line-height:1.6;padding-left:22px;position:relative;margin-bottom:8px;}
.checklist li::before{content:"✓";position:absolute;left:0;top:0;color:var(--blue);font-weight:800;}
.checklist ul{margin:0;padding:0;}

.contact{margin-top:22px;background:var(--fg);border-radius:var(--r-lg);padding:22px 18px;text-align:center;}
.contact p.l{font-size:15px;font-weight:600;color:#fff;line-height:1.6;}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-block-size:56px;margin-top:14px;padding:0 16px;background:var(--blue);color:#fff;text-decoration:none;border-radius:var(--r);font-size:18px;font-weight:700;}
.cta:hover{background:var(--blue-d);}

.notes{margin-top:22px;font-size:11.5px;color:var(--fg-3);}
.notes h2{font-size:12px;color:var(--fg-2);margin-bottom:8px;}
.notes ul{margin:0;padding-left:15px;}
.notes li{margin-bottom:6px;line-height:1.6;}
.notes strong{color:var(--fg-2);font-weight:700;}

footer{margin-top:26px;text-align:center;font-size:12.5px;color:var(--fg-3);line-height:1.7;}
footer .agency{font-weight:700;color:var(--fg-2);}
footer a{font-weight:700;text-decoration:none;}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
</style>
</head>

  cur = { slug: aptSel.value, name: a.name, dongLabel: a.dongs[di], ho, area: a.areas[row[2]], price: priceWon };
  pv.textContent = KRW(priceWon);
  pe.textContent = `${a.name} ${a.dongs[di]}동 ${ho}호 · 전용 ${cur.area}㎡`;
  priceBox.classList.add("on");
  refreshGo();
});

function numVal(el){ const v = parseFloat((el.value || "").replace(/[^0-9.]/g,"")); return isNaN(v) ? 0 : v; }
[$("deposit"), $("senior")].forEach(el => el.addEventListener("input", () => { refreshGo(); resultEl.classList.remove("on"); }));
function refreshGo(){ goBtn.disabled = !(cur && numVal($("deposit")) > 0); }

const PILL = { ok:'<span class="pill ok">가입 가능</span>', maybe:'<span class="pill maybe">확인 필요</span>', no:'<span class="pill no">한도 초과</span>' };

goBtn.addEventListener("click", () => {
  const P = cur.price;                    // 공시가격(원)
  const D = won(numVal($("deposit")));    // 전세보증금(원)
  const S = won(numVal($("senior")));     // 선순위채권(원)

  const V140 = P * 1.40;                  // 공시가격 기준 주택가격
  const hugHfCap = V140 * 0.90 - S;       // = 공시가격×126% - 선순위
  const depositLimit = 5e8;               // 비수도권(충북 청주) 전세보증금 한도
  const seniorOverHalf = S > V140 * 0.60; // 선순위 60% 초과 시 제한

  // HUG
  let hug;
  if (D > depositLimit) hug = { st:"no", line:`전세보증금이 <b>비수도권 한도 5억원</b>을 초과합니다.`, sub:"오송(충북 청주)은 수도권이 아니어서 5억원까지만 가능합니다." };
  else if (seniorOverHalf) hug = { st:"maybe", line:`선순위 채권이 주택가격의 60%를 넘어 <b>가입이 제한</b>될 수 있습니다.`, sub:"근저당을 말소하는 조건이면 가능할 수 있습니다." };
  else if (D <= hugHfCap) hug = { st:"ok", line:`전세보증금 <b>${KRW(D)}</b> ≤ 공시가격 기준 한도 <b>${KRW(hugHfCap)}</b>`, sub:"실거래가·KB시세가 확인되면 한도가 더 늘어날 수 있습니다." };
  else hug = { st:"no", line:`전세보증금 <b>${KRW(D)}</b> > 공시가격 기준 한도 <b>${KRW(hugHfCap)}</b> · <b>약 ${KRW(D - hugHfCap)} 초과</b>`, sub:"단, 아파트는 KB시세·실거래가가 우선 적용되므로 시세가 높으면 가입될 수 있습니다. 정확한 판정은 상담을 통해 확인하세요." };

  // HF (일반전세지킴보증) — 계산식은 HUG와 사실상 동일, 단 HF 전세대출 이용(예정)자만
  let hf;
  const hfBase = (D > depositLimit) ? { st:"no", line:`전세보증금이 <b>비수도권 한도 5억원</b>을 초과합니다.` }
    : seniorOverHalf ? { st:"maybe", line:`선순위 채권 과다로 한도가 크게 줄어듭니다.` }
    : (D <= hugHfCap) ? { st:"ok", line:`전세보증금 <b>${KRW(D)}</b> ≤ 보증한도 <b>${KRW(hugHfCap)}</b> (주택가격의 90% − 선순위)` }
    : { st:"no", line:`전세보증금 <b>${KRW(D)}</b> > 보증한도 <b>${KRW(hugHfCap)}</b>` };
  hf = { st: hfBase.st === "ok" ? "maybe" : hfBase.st, line: hfBase.line, sub:"HF 전세지킴보증은 <b>HF 전세자금대출을 이용 중이거나 함께 신청</b>하는 경우에만 가입할 수 있습니다. 전세대출이 없다면 HUG·SGI를 이용하세요." };

  // SGI (전세금보장신용보험) — 시세 기준. 공시가격만으로는 확정 불가.
  const estMarket = V140;                 // 보수적 추정 시세(실제 아파트 시세는 보통 더 높음)
  let sgi;
  if (S > estMarket * 0.50) sgi = { st:"no", line:`선순위 채권이 주택가격의 <b>50%</b>를 초과하면 SGI 가입이 불가합니다.`, sub:"근저당 말소가 전제되어야 합니다." };
  else if (D + S <= estMarket) sgi = { st:"ok", line:`전세보증금 + 선순위 <b>${KRW(D + S)}</b> ≤ 추정 시세 <b>${KRW(estMarket)}</b> · <b>아파트는 보증금 한도 없음</b>`, sub:"SGI는 KB시세 등 실제 시세로 심사하며, 아파트 시세는 보통 이 추정치보다 높습니다." };
  else sgi = { st:"maybe", line:`공시가격 기준 추정 시세로는 <b>빠듯</b>하지만, SGI는 실제 KB시세로 심사합니다.`, sub:"KB시세가 전세보증금 이상이면 가입 가능성이 있습니다. 시세 확인 후 상담하세요." };

  const card = (nm, sub, r) => `
    <div class="gcard">
      <div class="head"><div class="nm">${nm}<small>${sub}</small></div>${PILL[r.st]}</div>
      <div class="line">${r.line}</div>
      <div class="sub">${r.sub}</div>
    </div>`;

  resultEl.innerHTML = `
    <div class="summary">
      <div class="t">${cur.name} ${cur.dongLabel}동 ${cur.ho}호</div>
      <div class="row"><span>2026 공시가격</span><b class="num">${KRW(P)}</b></div>
      <div class="row"><span>전세보증금</span><b class="num">${KRW(D)}</b></div>
      <div class="row"><span>선순위 채권</span><b class="num">${S ? KRW(S) : "없음"}</b></div>
      <div class="cap">
        <div class="k">HUG·HF 공시가격 기준 최대 전세보증금 (공시가격 × 126% − 선순위)</div>
        <div class="v num">${KRW(Math.max(0, hugHfCap))}</div>
      </div>
    </div>
    ${card("HUG 전세보증금반환보증", "주택도시보증공사 · 가장 대중적", hug)}
    ${card("HF 전세지킴보증", "한국주택금융공사 · 전세대출 이용자", hf)}
    ${card("SGI 전세금보장신용보험", "SGI서울보증 · 고액 전세 가능", sgi)}

    <div class="checklist">
      <h3>금액과 별개로 아래 조건도 충족해야 합니다</h3>
      <ul>
        <li>입주와 동시에 <b>전입신고 + 확정일자</b>를 받아 대항력·우선변제권을 갖출 것</li>
        <li><b>공인중개사</b>를 통해 작성한 전세계약서일 것 (SGI는 필수)</li>
        <li>등기부등본상 <b>압류·가압류·경매개시·신탁등기·위반건축물</b>이 없을 것</li>
        <li>임대인의 <b>국세·지방세 체납</b>이 없을 것 (미납국세 열람 권장)</li>
        <li>신규 계약은 <b>전세계약기간의 1/2이 지나기 전</b>에 신청할 것</li>
        <li>전세계약기간이 <b>1년 이상</b>이고 실제 거주할 것</li>
      </ul>
    </div>

    <section class="contact">
      <p class="l">우리 호수가 되는지, 근저당·시세까지<br>같이 확인하고 싶으시면 편하게 문의주세요.</p>
      <a class="cta" href="tel:010.7660.0411">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>오송미소부동산에 물어보기</span>
      </a>
    </section>

    <section class="notes">
      <h2>유의사항 — 꼭 읽어주세요</h2>
      <ul>
        <li>이 조회는 <strong>2026년 공동주택 공시가격</strong>에 근거한 <strong>참고용 자동 계산</strong>이며, 실제 심사 결과와 다를 수 있습니다.</li>
        <li>아파트는 대부분 <strong>KB시세·한국부동산원 시세·실거래가</strong>가 있어 그 금액이 공시가격보다 <strong>우선 적용</strong>됩니다. 이 경우 한도가 본 조회보다 <strong>늘어날 수</strong> 있습니다.</li>
        <li>선순위 임차인(전입세대 열람), 임대인의 신용·세금 체납, 건물 하자, 신탁·위반건축물 여부 등은 <strong>반영되지 않았습니다</strong>.</li>
        <li>HUG는 담보인정비율을 현행 <strong>90% → 80%</strong>로 낮추는 방안을 예고했습니다. 시행되면 한도가 <strong>공시가격의 약 112%</strong>로 축소됩니다.</li>
        <li>SGI 결과는 공시가격×140%를 보수적 시세로 가정한 것으로, <strong>실제 KB시세로 재확인</strong>이 필요합니다.</li>
        <li>최종 가입 가능 여부는 <strong>HUG·HF·SGI 및 협약은행</strong>에서 확인하시기 바랍니다. 본 페이지는 오송미소부동산이 제공하는 참고 도구입니다.</li>
      </ul>
    </section>`;
  resultEl.classList.add("on");
  resultEl.scrollIntoView({ behavior:"smooth", block:"start" });
});
</script>
</body>
</html>
